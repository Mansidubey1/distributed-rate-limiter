services:
  postgres:
    image: postgres:16-alpine
    container_name: rate_limiter_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rate_limiter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rate_limiter"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rate_limiter_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rate-limiter-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate_limiter_1
    restart: always
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rate_limiter"
      REDIS_URL: "redis://redis:6379"
      DISTRIBUTED_MODE: "true"
      INSTANCE_ID: "limiter-01"
      INSTANCE_COUNT: "3"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rate-limiter-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate_limiter_2
    restart: always
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rate_limiter"
      REDIS_URL: "redis://redis:6379"
      DISTRIBUTED_MODE: "true"
      INSTANCE_ID: "limiter-02"
      INSTANCE_COUNT: "3"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rate-limiter-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate_limiter_3
    restart: always
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rate_limiter"
      REDIS_URL: "redis://redis:6379"
      DISTRIBUTED_MODE: "true"
      INSTANCE_ID: "limiter-03"
      INSTANCE_COUNT: "3"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  load-balancer:
    image: nginx:alpine
    container_name: rate_limiter_lb
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rate-limiter-1
      - rate-limiter-2
      - rate-limiter-3

volumes:
  pgdata:
